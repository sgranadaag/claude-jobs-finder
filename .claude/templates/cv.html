<!doctype html>
<!--
  Replica of the format of docs/CV ATS Format EN.pdf / ES.pdf.
  Filled by .claude/scripts/build-cv.mjs from applications/<ID>/cv.md: do not edit by hand per offer.
  If the style changes here, rerun the script to rebuild the CVs.
-->
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<title>{{name}}</title>
<style>
  @page { size: Letter; margin: 20mm 19mm 18mm 19mm; }
  * { box-sizing: border-box; }
  body { font-family: Tahoma, Verdana, Geneva, sans-serif; font-size: 10.5pt; line-height: 1.3; color: #000; margin: 0; }
  .name { font-size: 14pt; font-weight: bold; margin: 0; }
  .contact { font-size: 13pt; line-height: 1.25; }
  hr { border: 0; border-top: 1.5px solid #999; margin: 8px 0 18px; }
  h2 { font-size: 12pt; font-weight: bold; margin: 16px 0 0; }
  h2.big { font-size: 13pt; }
  p { margin: 0; }
  .summary { text-align: left; }

  .proficient { margin-bottom: 4px; }
  .skills-grid { display: grid; grid-template-columns: repeat(3, 1fr); column-gap: 20px; padding-left: 30px; }
  .skills-grid ul { margin: 0 0 14px; padding-left: 20px; }
  .skills-grid li { margin: 0; }

  .langs { display: grid; grid-template-columns: 1fr 1fr; padding-left: 26px; }

  .company { font-weight: bold; margin-top: 18px; }
  .row { display: flex; justify-content: space-between; }
  .desc { padding: 10px 0 0 18px; }
  .desc p { margin-bottom: 12px; }
  .skills-line { margin-top: 4px; }
  .job { page-break-inside: avoid; }

  .edu { margin-top: 2px; margin-bottom: 14px; }
  .edu .row span:first-child, .lead-row span:first-child { font-weight: bold; }
</style>
</head>
<body>
{{body}}
</body>
</html>
